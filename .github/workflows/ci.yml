# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"
      - run: uv python install
      - name: Install dependencies for static checks
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests devtools
      - name: Ruff format (check only)
        run: uv run --no-sync ruff format --check src tests devtools
      - name: BasedPyright
        run: uv run --no-sync basedpyright
      - name: Marimo notebook lint
        run: uv run --with marimo marimo check notebooks/gao_best_of_n.py

  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v7
        with:
          # Update this as needed:
          version: "0.10.2"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run --no-sync pytest

      # This test is optional for local runs but mandatory in CI. Install
      # transformers here rather than adding it to the runtime HF adapter extra.
      - name: Require HF GPT-2 logits equivalence
        if: matrix.python-version == '3.12'
        env:
          HF_EQUIV_REQUIRED: "1"
        run: uv run --with 'transformers>=4.57,<5' pytest -q tests/instruction/test_hf_gpt2_equivalence.py

  # Verify that the core package works with no optional ML backends installed.
  minimal-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Use the final 3.15.0 release, not an older 3.15 alpha.
        python-version: ["3.14", "3.15.0"]
    # Keep the new Python release exploratory until dependencies are verified.
    continue-on-error: ${{ matrix.python-version == '3.15.0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          # uv 0.10.2 predates stable Python 3.15 and selects 3.15.0a5.
          version: "0.13.1"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install requested Python release
        run: uv python install "${{ matrix.python-version }}"
      - name: Show selected Python version
        run: uv python find
      - name: Install only core dependencies
        run: uv sync --no-dev
      - name: Run minimal-install smoke test
        run: uv run --no-sync python tests/smoke_minimal.py


  # Temporary PR-scoped integration run against public pretrained GPT-2 124M.
  # Remove after the run; avoid downloading 124M on every ordinary CI job.
  gao-pretrained-124m:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/gao-gpt2-124m-live-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: "3.12"
      - run: uv python install "3.12"
      - name: Install GPT-2 and JAX training dependencies
        run: uv sync --all-extras
      - name: Generate actual GPT-2 124M completions
        timeout-minutes: 44
        run: |
          uv run --no-sync --with 'transformers>=4.57,<5' \
            python -u -m alpacax.examples.gao_gpt2_candidates \
              --prompts-path docs/gao-prompts.example.jsonl \
              --output-path runs/gao-gpt2/candidates.jsonl \
              --model-name openai-community/gpt2 \
              --seed 42 --candidates-per-prompt 8 \
              --max-new-tokens 20 --batch-size 4
      - name: Check gold-label balance before proxy training
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from collections import defaultdict
          from alpacax.examples.gao_text_best_of_n import gold_binary
          source = "runs/gao-gpt2/candidates.jsonl"
          rows = [json.loads(s) for s in open(source, encoding="utf-8")]
          balance = defaultdict(lambda: [0, 0])
          for row in rows:
              label = int(gold_binary(row["completion"], row["target"]))
              balance[(row["split"], row["prompt_id"])][label] += 1
          print("GOLD LABEL COUNTS (zero, one):", flush=True)
          for key, counts in sorted(balance.items()):
              print(key, counts, flush=True)
          print("TOTAL COMPLETIONS:", len(rows), flush=True)
          print("FIRST THREE COMPLETIONS:", flush=True)
          for row in rows[:3]:
              print({k: row[k] for k in ("prompt_id", "candidate_index", "completion")}, flush=True)
          PY
      - name: Train independent text proxy and evaluate best-of-N
        run: |
          uv run --no-sync python -u -m alpacax.examples.gao_text_best_of_n \
            --cache-path runs/gao-gpt2/candidates.jsonl \
            --output-dir runs/gao-gpt2-study \
            --seed 42 --epochs 10
      - name: Inspect actual gold and proxy curves
        if: success()
        run: |
          echo "=== best_of_n.csv ==="
          cat runs/gao-gpt2-study/best_of_n.csv
          echo "=== summary.json ==="
          cat runs/gao-gpt2-study/summary.json
      - name: Keep cached completions and study artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gao-pretrained-gpt2-124m-seed42
          path: |
            runs/gao-gpt2/candidates.jsonl
            runs/gao-gpt2-study/best_of_n.csv
            runs/gao-gpt2-study/summary.json
            runs/gao-gpt2-study/history.json
          if-no-files-found: warn
          retention-days: 7
